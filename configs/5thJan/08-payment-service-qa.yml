server:
  port: 8081

spring:
  application:
    name: 08-payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/irctcbooking
    username: root
    password: "@Bismillah#"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect

  kafka:
    bootstrap-servers: localhost:9092

    template:
      observation-enabled: true

    producer:
      observation-enabled: true

      key-serializer: org.apache.kafka.common.serialization.StringSerializer

      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      acks: all

      enable-idempotence: true

      retries: 2147483647

      max-in-flight-requests-per-connection: 5

      properties:
        spring.json.type.mapping: "paymentCompleted:payment.service.event.PaymentCompletedEvent"

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

    fetch-registry: true
    register-with-eureka: true

management:
  tracing:
    enabled: true

    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"
