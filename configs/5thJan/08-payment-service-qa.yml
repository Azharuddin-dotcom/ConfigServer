spring:
  application:
    name: 08-payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/irctcbooking
    username: root
    password: "@Bismillah#"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
