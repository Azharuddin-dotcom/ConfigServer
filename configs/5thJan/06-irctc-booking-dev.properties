spring.application.name=06-irctc-booking

server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/irctcbooking
spring.datasource.username=root
spring.datasource.password=@Bismillah#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Actuator Configuration Properties
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.application.name=Payment Service
info.application.description=IRCTC Payment Microservice
info.application.version=1.0.0

# Kafka Configuration

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer Serializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Producer Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Recommended settings for idempotence
spring.kafka.producer.properties.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Eureka Service Registry Port(host) -
eureka.client.service-url.defaultZone=http://localhost:8761/eureka